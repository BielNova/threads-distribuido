# Balanceador de carga na frente das 2 réplicas do gateway.
# Se uma réplica cair, a requisição é reenviada para a outra (failover).
events {}

http {
    # DNS interno do Docker: reconsulta os IPs a cada 5 s. Assim, se um gateway for
    # recriado (e ganhar outro IP), o nginx acompanha sem precisar reiniciar.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream gateways {
        zone gateways 64k;   # memória compartilhada exigida pelo "resolve"
        server gateway1:8080 max_fails=1 fail_timeout=5s resolve;
        server gateway2:8080 max_fails=1 fail_timeout=5s resolve;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateways;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 2s;
            proxy_read_timeout 3600s;               # conexões SSE ficam abertas
            proxy_buffering off;                    # SSE: entrega cada evento na hora
            # tenta a outra réplica se esta não responder (inclusive POST: é seguro porque
            # o gateway é idempotente com Idempotency-Key)
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
            proxy_next_upstream_tries 2;
        }
    }
}
